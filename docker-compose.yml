services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
  prom-server:
    image: prom/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - gateway
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
  mock-provider-a:
    build: ./mock_provider_a
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  mock-provider-b:
    build: ./mock_provider_b
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  gateway:
    build: ./gateway
    environment:
      CIRCUIT_FAILURE_THRESHOLD: ${CIRCUIT_FAILURE_THRESHOLD:-3}
      CIRCUIT_COOLDOWN_SECONDS: ${CIRCUIT_COOLDOWN_SECONDS:-10}
      REDIS_URL: redis://redis:6379/0
      TOKEN_BUCKET_CAPACITY: ${TOKEN_BUCKET_CAPACITY:-6}
      REFILL_RATE: ${REFILL_RATE:-1}
      RATE_LIMIT_KEY_PREFIX: ${RATE_LIMIT_KEY_PREFIX:-rate_limit}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      mock-provider-a:
        condition: service_healthy
      mock-provider-b:
        condition: service_healthy
      
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
